[project]
name = "launch-control"
version = "1.0.0"
description = "Учебный сервис управления запусками ракет для задания по оптимизации Docker-образа"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # Внимание: pandas и numpy сервису (app/) не нужны - их импортирует только
    # офлайн-скрипт tools/analyze_launches.py. Положены в основные зависимости
    # «на всякий случай», как это часто бывает в реальных проектах.
    "pandas>=2.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
