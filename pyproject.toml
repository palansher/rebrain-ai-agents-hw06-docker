[project]
name = "launch-control"
version = "1.0.0"
description = "Учебный сервис управления запусками ракет для задания по оптимизации Docker-образа"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# pandas/numpy нужны только офлайн-скрипту tools/analyze_launches.py,
# рантайму сервиса (app/) они не требуются.
analytics = [
    "pandas>=2.2",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
